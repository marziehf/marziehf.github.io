<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ site.author.photo | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <div class="wrap{% if page.wide %} wrap-wide{% endif %}">
    {% include nav.html %}
    <main class="{% if page.layout == 'post' %}post{% else %}content{% endif %}">
      {{ content }}
    </main>
    <footer class="site-footer">
      © {{ 'now' | date: '%Y' }} {{ site.author.name }}
    </footer>
  </div>
</body>
</html>
